spring.application.name=bookingSite
# Default profile to use if none is specified
#spring.profiles.active=dev
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
spring.datasource.url=jdbc:postgresql://192.168.1.100:5432/bookingDB
spring.datasource.username=postgres
spring.datasource.password=admin@2026

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================================
# Spring AI MCP Server Configuration
# ========================================

spring.ai.mcp.server.name=booking-site-mcp
spring.ai.mcp.server.version=0.0.1-SNAPSHOT

# Protocol Options (Choose one)
spring.ai.mcp.server.protocol=STREAMABLE
# spring.ai.mcp.server.protocol=STATELESS
#spring.ai.mcp.server.protocol=SSE

# Optional but recommended settings
spring.ai.mcp.server.enabled=true

# Server name shown to AI clients
spring.ai.mcp.server.info.name=Booking Site MCP Server
spring.ai.mcp.server.info.description=Online Booking System MCP Server

# If you want to run MCP on a different port (optional)
# server.port=8080
# spring.ai.mcp.server.port=8081

# Logging (Helpful during development)
logging.level.org.springframework.ai.mcp=DEBUG